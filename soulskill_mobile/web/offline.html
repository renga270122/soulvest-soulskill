<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#5B4BCE">
  <title>You're offline — SoulSkill</title>
  <style>
    *{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#FBFAFF;color:#30286F;font:16px/1.55 system-ui,sans-serif}
    main{max-width:420px;text-align:center;background:#fff;border:1px solid #E8E5F5;border-radius:24px;padding:32px;box-shadow:0 16px 48px #30286f12}
    .mark{width:58px;height:58px;margin:0 auto 18px;border-radius:18px;display:grid;place-items:center;color:#fff;font-size:30px;background:linear-gradient(145deg,#7667F2,#4332AC)}
    h1{font-size:24px;margin:0 0 10px}p{color:#6C6682;margin:0 0 22px}
    button{border:0;border-radius:999px;padding:12px 20px;background:#5142C5;color:#fff;font-weight:700;font-size:14px}
  </style>
</head>
<body>
  <main>
    <div class="mark" aria-hidden="true">✦</div>
    <h1>You're offline</h1>
    <p>SoulSkill needs a connection for this page to load for the first time. Reconnect to the internet and try again. Your saved draft remains on this device.</p>
    <button type="button" onclick="window.location.reload()">Try again</button>
  </main>
</body>
</html>

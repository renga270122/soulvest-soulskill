[server]
headless = true
enableCORS = true
port = 8501

[theme]
base = "light"
primaryColor = "#6A1B9A"         # Soulful purple
backgroundColor = "#FFF8F0"      # Gentle cream
secondaryBackgroundColor = "#F0F0F0"
textColor = "#333333"
font = "sans serif"

[theme.sidebar]
primaryColor = "#FFFFFF"
backgroundColor = "#1E3A8A"
secondaryBackgroundColor = "#2563EB"
textColor = "#FFFFFF"
borderColor = "#93C5FD"
showWidgetBorder = true

[browser]
gatherUsageStats = false

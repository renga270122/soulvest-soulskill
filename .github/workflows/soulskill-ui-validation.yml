name: SoulSkill Flutter UI Validation
on:
  push:
    branches:
      - "feature/soulskill-global-dashboard-experience"
    paths:
      - "soulskill_mobile/**"
      - "api_server.py"
      - "resume_job_service.py"
      - "tests/test_resume_job_service.py"
      - "scripts/bootstrap_android.sh"
      - "scripts/verify_pwa.sh"
      - ".github/workflows/soulskill-ui-validation.yml"
  pull_request:
    branches:
      - "feature/**"
    paths:
      - "soulskill_mobile/**"
      - "api_server.py"
      - "resume_job_service.py"
      - "tests/test_resume_job_service.py"
      - "scripts/bootstrap_android.sh"
      - "scripts/verify_pwa.sh"
      - ".github/workflows/soulskill-ui-validation.yml"
permissions:
  contents: read
jobs:
  flutter-ui:
    name: Analyze, test and build Flutter app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.47.9"
          cache: true
      - name: Install Flutter dependencies
        working-directory: soulskill_mobile
        run: flutter pub get
      - name: Verify committed PWA files
        run: bash ./scripts/verify_pwa.sh
      - name: Set up Python for resume analysis tests
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run resume job-fit service tests
        run: |
          python -m pip install --upgrade pip
          python -m pip install pytest
          pytest tests/test_resume_job_service.py -q
      - name: Analyze Flutter source
        working-directory: soulskill_mobile
        run: flutter analyze --no-pub
      - name: Run Flutter widget and unit tests
        working-directory: soulskill_mobile
        run: flutter test --no-pub
      - name: Build responsive PWA for the web
        working-directory: soulskill_mobile
        run: flutter build web --release
      - name: Verify generated web bundle
        working-directory: soulskill_mobile
        run: |
          test -s build/web/index.html
          test -s build/web/manifest.json
          test -s build/web/sw.js
          test -s build/web/icons/Icon-192.png
          test -s build/web/icons/Icon-512.png
      - name: Upload browser PWA preview
        uses: actions/upload-artifact@v4
        with:
          name: soulskill-global-dashboard-pwa
          path: soulskill_mobile/build/web/
          if-no-files-found: error
      - name: Generate Android host project
        run: bash ./scripts/bootstrap_android.sh
      - name: Build debug APK
        working-directory: soulskill_mobile
        run: flutter build apk --debug
      - name: Upload Android preview APK
        uses: actions/upload-artifact@v4
        with:
          name: soulskill-global-dashboard-debug-apk
          path: soulskill_mobile/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

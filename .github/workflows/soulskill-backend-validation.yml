name: SoulSkill Backend Core API
on:
  push:
    branches:
      - "feature/soulskill-backend-core-api"
    paths:
      - "backend/**"
      - "resume_job_service.py"
      - "tests/test_resume_job_service.py"
      - "tests/test_backend_api.py"
      - ".github/workflows/soulskill-backend-validation.yml"
  pull_request:
    branches:
      - "feature/**"
    paths:
      - "backend/**"
      - "resume_job_service.py"
      - "tests/test_resume_job_service.py"
      - "tests/test_backend_api.py"
      - ".github/workflows/soulskill-backend-validation.yml"
permissions:
  contents: read
jobs:
  backend:
    name: Test FastAPI resume workflows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - name: Install backend and test dependencies
        run: python -m pip install -r backend/requirements-dev.txt
      - name: Run resume service and API tests
        run: pytest tests/test_resume_job_service.py tests/test_backend_api.py -q

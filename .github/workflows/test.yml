# GitHub Actions CI/CD Pipeline
name: Test SoulSkill Resume Builder

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '0 2 * * *'

jobs:
  unit-tests:
    name: Python unit tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov
          pip install -r requirements.txt
      - name: Run unit tests
        run: pytest test_app.py -v --cov=. --cov-report=xml --cov-report=term
      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          files: ./coverage.xml
          fail_ci_if_error: false

  flutter-mobile:
    name: Flutter mobile static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: soulskill_mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: soulskill_mobile
        run: flutter analyze --no-pub
      - name: Run Flutter widget tests
        working-directory: soulskill_mobile
        run: flutter test --no-pub
      - name: Generate Android host project
        run: ./scripts/bootstrap_android.sh
      - name: Build debug APK
        working-directory: soulskill_mobile
        run: flutter build apk --debug


  e2e-tests:
    name: Streamlit browser tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - name: Install dependencies and browser
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest playwright pytest-playwright
          playwright install --with-deps chromium
      - name: Start Streamlit app for browser tests
        run: |
          streamlit run app.py --server.headless true --server.port 8501 > /tmp/soulskill-streamlit.log 2>&1 &
          for attempt in {1..30}; do
            if curl -fsS http://127.0.0.1:8501/_stcore/health > /dev/null; then
              echo "Streamlit app is ready"
              exit 0
            fi
            sleep 2
          done
          cat /tmp/soulskill-streamlit.log
          echo "Streamlit app did not become healthy"
          exit 1
      - name: Run E2E tests
        run: pytest test_e2e.py -v
        env:
          E2E_APP_URL: http://127.0.0.1:8501
      - name: Upload test screenshots on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-screenshots
          path: test-results/
          if-no-files-found: warn

  live-app-check:
    name: Live App Reachability Check
    runs-on: ubuntu-latest
    steps:
      - name: Check if app endpoint is reachable
        run: |
          response=$(curl --max-time 20 -s -o /dev/null -w "%{http_code}" https://soulvest-soulskill-rwwrmxhx5mmuak37j9ap6z.streamlit.app/ || true)
          case "$response" in
            2[0-9][0-9]|3[0-9][0-9])
              echo "App endpoint is reachable (HTTP $response)"
              ;;
            *)
              echo "App endpoint returned HTTP $response"
              exit 1
              ;;
          esac
      - name: Check response time
        run: |
          start=$(date +%s)
          curl --max-time 20 -s https://soulvest-soulskill-rwwrmxhx5mmuak37j9ap6z.streamlit.app/ > /dev/null || true
          end=$(date +%s)
          duration=$((end - start))
          echo "Response time: ${duration}s"
          if [ "$duration" -gt 15 ]; then
            echo "Warning: endpoint response exceeded 15 seconds"
          else
            echo "Endpoint response time is within 15 seconds"
          fi

  lighthouse-audit:
    name: Lighthouse Performance Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v9
        with:
          urls: |
            https://soulvest-soulskill-rwwrmxhx5mmuak37j9ap6z.streamlit.app/
          uploadArtifacts: true
          temporaryPublicStorage: true

  notify:
    name: Notify on Test Failure
    needs: [unit-tests, flutter-mobile, e2e-tests, live-app-check]
    if: failure()
    runs-on: ubuntu-latest
    steps:
      - name: Summarize failed checks
        run: echo "One or more SoulSkill quality checks failed. Review the workflow jobs for details."

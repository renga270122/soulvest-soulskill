name: SoulSkill Platform Configuration Checks

on:
  push:
    branches:
      - "fix/**"
    paths:
      - "api_server.py"
      - "tests/**"
      - "soulskill_mobile/**"
      - ".github/workflows/soulskill-platform-checks.yml"
  pull_request:
    branches:
      - main
      - "feature/**"
    paths:
      - "api_server.py"
      - "tests/**"
      - "soulskill_mobile/**"
      - ".github/workflows/soulskill-platform-checks.yml"

permissions:
  contents: read

jobs:
  backend-config-tests:
    name: Backend configuration tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest
      - name: Test API CORS configuration
        run: pytest tests/test_api_cors_config.py -q

  flutter-checks:
    name: Flutter analyze and tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Install Flutter dependencies
        working-directory: soulskill_mobile
        run: flutter pub get
      - name: Analyze Flutter source
        working-directory: soulskill_mobile
        run: flutter analyze --no-pub
      - name: Run Flutter tests
        working-directory: soulskill_mobile
        run: flutter test --no-pub
